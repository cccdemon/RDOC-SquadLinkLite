# GitLab CI mirror of .github/workflows/test.yml: the full test suite on a
# GitLab runner (docker executor). Every job installs the same toolchains as
# e2e/Dockerfile.test and then runs one stage of e2e/test-all.sh — the script
# is the single definition of what "the tests" are.
#
# Caches are keyed per job so the Rust target dirs (workspace vs src-tauri,
# different lockfiles) never share a directory.

stages: [test]

default:
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "1"

.rust-base:
  stage: test
  image: rust:1-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config clang cmake file libopus-dev libasound2-dev libssl-dev $EXTRA_APT
    - rustup component add clippy
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - target

rust:
  extends: .rust-base
  script:
    - ONLY=rust bash e2e/test-all.sh --native

tauri:
  extends: .rust-base
  variables:
    EXTRA_APT: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/apps/companion/src-tauri/target
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - apps/companion/src-tauri/target
  script:
    - ONLY=tauri bash e2e/test-all.sh --native

frontend:
  stage: test
  image: node:22-bookworm
  before_script:
    - npm install -g pnpm@10
  cache:
    key: $CI_JOB_NAME
    paths:
      - apps/companion/node_modules
  script:
    - ONLY=frontend bash e2e/test-all.sh --native

streamdeck:
  stage: test
  image: node:22-bookworm
  cache:
    key: $CI_JOB_NAME
    paths:
      - streamdeck-plugin/org.raumdock.subraum.sdPlugin/node_modules
  script:
    - ONLY=streamdeck bash e2e/test-all.sh --native
