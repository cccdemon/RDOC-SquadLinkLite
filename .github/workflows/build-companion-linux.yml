name: Build SquadLink Lite (Linux)

# Builds the RDOC SquadLink Lite desktop app (Tauri GUI) for Linux on clean
# runners — one job per architecture, native (no cross-compile), so the
# webkit2gtk link is real and the binary is trustworthy.
#
# - push to main / manual run        → builds + uploads bundles as workflow artifacts
# - push a tag `squadlink-lite-v*`   → also attaches the bundles to the GitHub Release
#
# Output formats: .deb, .rpm, .AppImage  (amd64 + arm64).
# The build is UNSIGNED — distro package managers / AppImage will not show a
# trusted publisher.

on:
  push:
    branches: [main]
    tags: ["squadlink-lite-v*"]
    paths:
      - "apps/companion/**"
      - "apps/companion-core/**"
      - "crates/**"
      - ".github/workflows/build-companion-linux.yml"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # tauri-action attaches assets to the Release on a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          # Native arm64 runner (GitHub-hosted). If unavailable on your plan,
          # swap to a self-hosted arm64 box or a cross-build job.
          - arch: arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system dependencies + cpal (ALSA) + AppImage tooling.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libopus-dev \
            libssl-dev \
            patchelf \
            file \
            wget \
            build-essential \
            curl \
            xdg-utils \
            desktop-file-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/companion/pnpm-lock.yaml

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target
          key: ${{ matrix.arch }}

      - name: Install frontend deps (reproducible)
        working-directory: apps/companion
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (+ release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/companion
          # Override the Windows-only targets in tauri.conf.json with Linux formats.
          args: --target ${{ matrix.rust_target }} --bundles deb,rpm,appimage
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: RDOC SquadLink Lite ${{ github.ref_name }}
          releaseDraft: false
          prerelease: true
          releaseBody: |
            RDOC SquadLink Lite prototype build (Linux ${{ matrix.arch }}).
            Unsigned prototype — .deb / .rpm / .AppImage.

      # SHA-256 of every bundle → users can verify the download matches CI.
      - name: Generate SHA-256 checksums
        if: always()
        working-directory: apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle
        run: |
          : > SHA256SUMS-linux-${{ matrix.arch }}.txt
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort | while read -r f; do
            sha256sum "$f" | tee -a SHA256SUMS-linux-${{ matrix.arch }}.txt
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          echo "----- SHA256SUMS-linux-${{ matrix.arch }}.txt -----"
          cat SHA256SUMS-linux-${{ matrix.arch }}.txt

      - name: Attach checksums to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS-linux-${{ matrix.arch }}.txt --clobber --repo "${{ github.repository }}"

      - name: Upload Linux bundles artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdoc-squadlink-lite-linux-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.sha256
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/SHA256SUMS-linux-${{ matrix.arch }}.txt
