name: Build subraum (Windows)

# Builds the subraum desktop prototype (Tauri GUI) on a clean Windows
# runner — so it can be built/installed without a local Rust/Tauri toolchain.
#
# - push to main / manual run  → builds + uploads the installer as a workflow artifact
# - push a tag `subraum-v*`  → also creates a draft GitHub Release with the installers
#
# The prototype is UNSIGNED → Windows SmartScreen will warn on first run.

on:
  push:
    branches: [main]
    tags: ["subraum-v*"]
    paths:
      - "apps/companion/**"
      - "apps/companion-core/**"
      - "crates/**"
      - ".github/workflows/build-companion.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # tauri-action needs this to create the Release on a tag
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/companion/pnpm-lock.yaml

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target

      - name: Install frontend deps (reproducible)
        working-directory: apps/companion
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        working-directory: apps/companion
        run: pnpm audit --audit-level moderate

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        working-directory: apps/companion/src-tauri
        # Report-only: don't block prototype builds on unpatched transitive advisories.
        run: cargo audit || true

      - name: Generate app icons from the subraum logo
        working-directory: apps/companion
        run: pnpm tauri icon src/subraum.png

      - name: Build Tauri app (+ release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/companion
          # tagName non-empty only on a tag push → tauri-action then cuts a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: subraum ${{ github.ref_name }}
          # Published (not draft) so the server can auto-pull the asset; marked
          # prerelease because the build is unsigned.
          releaseDraft: false
          prerelease: true
          releaseBody: |
            subraum prototype build (Windows).
            Unsigned — Windows SmartScreen will warn; "More info → Run anyway".

      # SHA-256 of every installer → users can verify the download matches CI.
      - name: Generate SHA-256 checksums
        if: always()
        shell: pwsh
        working-directory: apps/companion/src-tauri/target/release/bundle
        run: |
          $sum = Join-Path $PWD 'SHA256SUMS-windows.txt'
          Remove-Item $sum -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Include *.exe,*.msi | Sort-Object FullName | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath $sum -Append
            $h | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
          Get-Content $sum

      - name: Attach checksums to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/companion/src-tauri/target/release/bundle
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS-windows.txt --clobber --repo "${{ github.repository }}"

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subraum-windows
          if-no-files-found: warn
          path: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/msi/*.msi
            apps/companion/src-tauri/target/release/bundle/**/*.sha256
            apps/companion/src-tauri/target/release/bundle/SHA256SUMS-windows.txt

      # Raw exe (+ WebView2 loader if emitted) handed to the MSIX job below.
      - name: Upload raw exe for MSIX packaging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subraum-exe
          if-no-files-found: warn
          path: |
            apps/companion/src-tauri/target/release/subraum.exe
            apps/companion/src-tauri/target/release/WebView2Loader.dll

  # Pack an UNSIGNED MSIX for Microsoft Store upload (Partner Center re-signs).
  # Deliberately NOT a dependency of notify-pull, so an MSIX failure never blocks
  # the deploy. The MSIX is a Store package and is never mirrored to /get anyway.
  # Reuses the raw exe from the build job — no rebuild.
  msix:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # gh release upload on a tag
    steps:
      - uses: actions/checkout@v7

      - name: Download built exe
        uses: actions/download-artifact@v8
        with:
          name: subraum-exe
          path: apps/companion/src-tauri/target/release

      # Manifest carries a hardcoded version; sync it to the app version so the
      # package version matches the release.
      - name: Sync AppxManifest version to app version
        shell: pwsh
        run: |
          $ver = (Get-Content apps/companion/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $manifest = Resolve-Path apps/companion/msix/AppxManifest.xml
          [xml]$m = Get-Content $manifest
          $m.Package.Identity.Version = "$ver.0"
          $m.Save($manifest)
          Write-Host "MSIX version -> $ver.0"

      # Run via Windows PowerShell 5.1 (pack.ps1 uses System.Drawing for the
      # visual assets). No -SelfSign → unsigned package for the Store.
      - name: Pack MSIX (unsigned)
        run: powershell -ExecutionPolicy Bypass -File apps/companion/msix/pack.ps1 -NoBuild

      - name: Generate SHA-256 checksum
        if: always()
        shell: pwsh
        working-directory: apps/companion/msix
        run: |
          $sum = 'SHA256SUMS-msix.txt'
          Remove-Item $sum -ErrorAction SilentlyContinue
          Get-ChildItem -Filter *.msix | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath $sum -Append
            $h | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
          Get-Content $sum

      - name: Attach MSIX to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/companion/msix
        run: |
          $msix = (Get-ChildItem -Filter *.msix | Select-Object -First 1).Name
          gh release upload "${{ github.ref_name }}" $msix SHA256SUMS-msix.txt --clobber --repo "${{ github.repository }}"

      - name: Upload MSIX artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subraum-msix
          if-no-files-found: warn
          path: |
            apps/companion/msix/*.msix
            apps/companion/msix/*.sha256
            apps/companion/msix/SHA256SUMS-msix.txt

  # Pack the Stream Deck plugin (a zip of the .sdPlugin folder). Cheap, pure
  # Node — built on Linux even though this is the Windows workflow, because the
  # artifact is platform-independent and this workflow is the one that owns the
  # release.
  streamdeck:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # gh release upload on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install runtime deps + pack
        working-directory: streamdeck-plugin
        run: |
          (cd org.raumdock.subraum.sdPlugin && npm ci --omit=dev)
          node test-harness.mjs
          zip -r subraum.streamDeckPlugin org.raumdock.subraum.sdPlugin
          sha256sum subraum.streamDeckPlugin | tee SHA256SUMS-streamdeck.txt
      - name: Attach to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: streamdeck-plugin
        run: |
          gh release upload "${{ github.ref_name }}"             subraum.streamDeckPlugin SHA256SUMS-streamdeck.txt             --clobber --repo "${{ github.repository }}"
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: subraum-streamdeck
          path: |
            streamdeck-plugin/subraum.streamDeckPlugin
            streamdeck-plugin/SHA256SUMS-streamdeck.txt

  # On a tag release, immediately tell the server to pull the new installer
  # (push trigger, instead of waiting for the hourly systemd timer). The SSH
  # key is locked to a forced command on the host: it can ONLY run
  # `systemctl start squadlink-installer.service` — no shell, no other access.
  # NOTE: the host-side unit still carries the pre-rename name; renaming it is a
  # server-side change (unit + forced-command entry in authorized_keys), not a
  # repo change. Nothing here depends on the name — the SSH command is `true`.
  # Waits for `streamdeck` as well as `build`: the pull script mirrors whatever is
  # attached to the Release at the moment it runs, and with `needs: build` alone it
  # raced the streamdeck job and won — v0.3.0 shipped with no plugin on /get even
  # though the script has always matched `.streamDeckPlugin`. MSIX stays out of the
  # dependency list on purpose (see above).
  notify-pull:
    needs: [build, streamdeck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server installer pull
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_PULL_KEY }}" > ~/.ssh/id_pull
          chmod 600 ~/.ssh/id_pull
          ssh -i ~/.ssh/id_pull -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            root@ve.raumdock.org true
