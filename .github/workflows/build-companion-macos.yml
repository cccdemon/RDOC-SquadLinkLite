name: Build subraum (macOS)

# Builds the subraum desktop app for macOS — one native job per
# arch (Apple Silicon on macos-14, Intel on macos-13), so each .dmg links the
# real system WebKit.
#
# - push to main / manual run        → builds + uploads bundles as workflow artifacts
# - push a tag `subraum-v*`   → also attaches the bundles to the GitHub Release
#
# Output: .dmg + .app (arm64 + x86_64).
# The build is UNSIGNED and NOT notarized — no Apple Developer account yet. On
# first launch Gatekeeper blocks it: right-click the app → Open → Open, or
# `xattr -dr com.apple.quarantine "subraum.app"`.

on:
  push:
    branches: [main]
    tags: ["subraum-v*"]
    paths:
      - "apps/companion/**"
      - "apps/companion-core/**"
      - "crates/**"
      - ".github/workflows/build-companion-macos.yml"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # tauri-action attaches assets to the Release on a tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14 # Apple Silicon
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-13 # Intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/companion/pnpm-lock.yaml

      # audiopus_sys finds no system Opus on a macOS runner, so it falls back to
      # building the vendored copy — and its autogen.sh needs autotools, which
      # the image does not ship ("autoreconf: command not found" → "Failed to
      # autogen Opus"). Deliberately NOT `brew install opus`: linking a Homebrew
      # dylib would make the .app depend on Homebrew being installed on the
      # user's Mac. The vendored build is static, so the bundle stays portable.
      - name: Install Opus build tooling
        run: brew install autoconf automake libtool

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target
          key: ${{ matrix.arch }}

      - name: Install frontend deps (reproducible)
        working-directory: apps/companion
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (+ release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/companion
          # Override the "all" bundle target with macOS formats for this arch.
          args: --target ${{ matrix.rust_target }} --bundles dmg,app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: subraum ${{ github.ref_name }}
          releaseDraft: false
          prerelease: true
          releaseBody: |
            subraum prototype build (macOS ${{ matrix.arch }}).
            Unsigned prototype — right-click the app → Open on first launch.

      - name: Generate SHA-256 checksums
        if: always()
        working-directory: apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle
        run: |
          : > SHA256SUMS-macos-${{ matrix.arch }}.txt
          find . -type f -name '*.dmg' | sort | while read -r f; do
            shasum -a 256 "$f" | tee -a SHA256SUMS-macos-${{ matrix.arch }}.txt
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done
          echo "----- SHA256SUMS-macos-${{ matrix.arch }}.txt -----"
          cat SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Attach checksums to Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS-macos-${{ matrix.arch }}.txt --clobber --repo "${{ github.repository }}"

      - name: Upload macOS bundles artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subraum-macos-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.sha256
            apps/companion/src-tauri/target/${{ matrix.rust_target }}/release/bundle/SHA256SUMS-macos-${{ matrix.arch }}.txt
