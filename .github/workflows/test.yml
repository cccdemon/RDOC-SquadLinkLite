name: Test suite

# The full test suite on every push and pull request: clippy (warnings are
# errors) + unit tests for the Rust workspace and src-tauri, tsc + vite build
# + vitest for the frontend, unit tests + fake-deck harness for the Stream
# Deck plugin. Same steps as `bash e2e/test-all.sh` locally — the script is
# the single definition, this workflow only provides the toolchains.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (protocol, init, companion-core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System deps (opus, ALSA, aws-lc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libopus-dev libasound2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ONLY=rust bash e2e/test-all.sh --native

  tauri:
    name: Tauri shell (src-tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System deps (Tauri Linux stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake file libopus-dev libasound2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri -> target
      - run: ONLY=tauri bash e2e/test-all.sh --native

  frontend:
    name: Frontend (tsc, vite, vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/companion/pnpm-lock.yaml
      - run: ONLY=frontend bash e2e/test-all.sh --native

  streamdeck:
    name: Stream Deck plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ONLY=streamdeck bash e2e/test-all.sh --native
