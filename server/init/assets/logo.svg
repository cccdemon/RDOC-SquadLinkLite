<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="subraum">
  <title>subraum</title>
  <!-- The surface. One peer breaks through it - that is where you connect;
       the rest of the mesh stays below. RDOC palette: Space/Steel/Off White,
       copper only on the docking node (the signet may carry the accent). -->
  <line x1="4" y1="14" x2="60" y2="14" stroke="#2B3135" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M32 14 V56 M11 35 H53" stroke="#76828D" stroke-width="2"/>
    <path d="M32 14 L53 35 L32 56 L11 35 Z" stroke="#F2F2F0" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <g fill="#F2F2F0">
    <circle cx="53" cy="35" r="3.6"/>
    <circle cx="32" cy="56" r="3.6"/>
    <circle cx="11" cy="35" r="3.6"/>
  </g>
  <circle cx="32" cy="14" r="3.6" fill="#C48A4A"/>
</svg>
