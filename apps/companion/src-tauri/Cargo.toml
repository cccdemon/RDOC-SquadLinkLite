[package]
name = "rdoc-squadlink-lite"
version = "0.1.27"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
companion-core = { path = "../../companion-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Deep link (squadlink://) config + single-instance forwarding of the launch URL.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

# Configurable PTT via Windows Raw Input — keeps firing while a fullscreen /
# elevated game holds the foreground (a WH_KEYBOARD_LL hook does not).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Shell",
  "Win32_Storage_Packaging_Appx",
  "Win32_Devices_HumanInterfaceDevice",
] }
# Ergonomic COM for WASAPI per-session audio ducking (lower other apps' volume
# while SquadLink voice is active). windows-sys raw vtable calls would be far
# more error-prone for COM.
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Media_Audio",
] }
