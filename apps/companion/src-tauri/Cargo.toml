[package]
name = "subraum"
version = "0.2.1"
edition = "2021"

# The Tauri app is built as a library so desktop (main.rs) and mobile
# (Android/iOS, via tauri::mobile_entry_point) share one `run()`. Mobile builds
# the app as a cdylib; desktop still produces the normal binary from main.rs.
[lib]
name = "subraum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
companion-core = { path = "../../companion-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Deep link (subraum://) config — supported on desktop + mobile.
tauri-plugin-deep-link = "2"

# Single-instance (launch-URL forwarding) is desktop-only — the plugin has no
# mobile target, so keep it out of Android/iOS builds.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Configurable PTT via Windows Raw Input — keeps firing while a fullscreen /
# elevated game holds the foreground (a WH_KEYBOARD_LL hook does not).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Shell",
  "Win32_Storage_Packaging_Appx",
  "Win32_Devices_HumanInterfaceDevice",
] }
# Ergonomic COM for WASAPI per-session audio ducking (lower other apps' volume
# while subraum voice is active). windows-sys raw vtable calls would be far
# more error-prone for COM.
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
] }
