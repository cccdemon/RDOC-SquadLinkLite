# Flatpak manifest for subraum — the delivery path for SteamOS /
# Steam Deck and the immutable gaming distros (Bazzite, ChimeraOS, …) where
# .deb/.rpm don't apply and Flatpak is the native install channel.
#
# Rather than rebuild the Rust app inside the (offline) Flatpak sandbox, this
# manifest unpacks the .deb that CI already built and installs its payload into
# /app, renaming the .desktop / icons / metainfo to the Flatpak app-id. The .deb
# is placed next to this manifest as `subraum.deb` by the CI job.
id: org.raumdock.Subraum
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
# Executable name inside the .deb (usr/bin/subraum).
command: subraum

finish-args:
  # Windowing: Wayland with an X11 fallback (Steam Deck Gaming Mode = Wayland).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU for the WebKitGTK webview.
  - --device=dri
  # Audio in + out — this is a voice app. PipeWire (SteamOS, modern distros)
  # exposes the PulseAudio socket; cpal records/plays through it.
  - --socket=pulseaudio
  # P2P media + signaling + the in-app update check.
  - --share=network
  # WebKitGTK 2.42+ DMABUF renderer is broken on many GPU/driver combos and
  # shows a blank window; force the stable GL path (belt-and-suspenders — the
  # binary also sets these itself if unset).
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  - name: subraum
    buildsystem: simple
    build-commands:
      # Crack the .deb (ar → data.tar.gz) and lay out its payload.
      - ar x subraum.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/subraum /app/bin/subraum
      # Icons, renamed to the Flatpak app-id at whatever sizes the .deb ships.
      # Do not hardcode the size list: `tauri icon` derives the installed hicolor
      # directories from the source image's dimensions, so regenerating the icons
      # from a differently sized master silently changes which ones exist. A
      # pinned list broke the build exactly that way once.
      - |
        found=0
        for src in usr/share/icons/hicolor/*/apps/subraum.png; do
          [ -e "$src" ] || continue
          size=$(basename "$(dirname "$(dirname "$src")")")
          install -Dm644 "$src" "/app/share/icons/hicolor/$size/apps/${FLATPAK_ID}.png"
          found=$((found + 1))
        done
        # An icon-less app is a broken Flatpak, so fail loudly rather than ship it.
        [ "$found" -gt 0 ] || { echo "no icons found in the .deb"; exit 1; }
        echo "installed $found icon size(s)"
      # Desktop entry, renamed to <app-id>.desktop and pointed at the renamed
      # icon + given proper categories (the .deb ships an empty Categories=).
      - install -Dm644 "usr/share/applications/subraum.desktop"
        /app/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/" /app/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Categories=.*/Categories=Network;AudioVideo;Game;/"
        /app/share/applications/${FLATPAK_ID}.desktop
      # AppStream metadata.
      - install -Dm644 org.raumdock.Subraum.metainfo.xml
        /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: subraum.deb
      - type: file
        path: org.raumdock.Subraum.metainfo.xml
