<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon source for `pnpm tauri icon`. Same mark as the site logo, on a
       dark tile so the light-blue strokes hold contrast on both light and dark
       desktops (a transparent version would vanish on a white taskbar). -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#0B0E14"/>
  <rect x="4" y="4" width="1016" height="1016" rx="176" ry="176" fill="none" stroke="#1B2130" stroke-width="8"/>

  <g transform="translate(512 512) scale(12.9) translate(-32 -35)">
    <line x1="4" y1="14" x2="60" y2="14" stroke="#3A4152" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round">
      <path d="M32 14 V56 M11 35 H53" stroke="#3D6FD8" stroke-width="2"/>
      <path d="M32 14 L53 35 L32 56 L11 35 Z" stroke="#7FB0FF" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g fill="#7FB0FF">
      <circle cx="32" cy="14" r="3.6"/>
      <circle cx="53" cy="35" r="3.6"/>
      <circle cx="32" cy="56" r="3.6"/>
      <circle cx="11" cy="35" r="3.6"/>
    </g>
  </g>
</svg>
