[package]
name = "companion-core"
version = "0.1.0"
edition.workspace = true

# Headless 2-peer (→ N-peer) mesh client: cpal+opus audio over webrtc-rs P2P,
# per-peer DataChannel chat, signaling to InitConnection. UI comes later.

[lib]
name = "companion_core"
path = "src/lib.rs"

[[bin]]
name = "companion-core"
path = "src/main.rs"

[dependencies]
protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
webrtc = "0.11"
audiopus = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
hex = "0.4"
# Post-quantum hybrid handshake (app-layer, over the DTLS DataChannel).
ml-kem = "0.2"
x25519-dalek = "2"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
futures = "0.3"
serde_json = "1"
base64 = "0.22"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
